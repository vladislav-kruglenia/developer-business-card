services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: business_card
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d business_card"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://card:card@postgres:5432/business_card?schema=public
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
